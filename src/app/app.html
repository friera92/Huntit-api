<div class="screen-wrapper">
  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="brand">
      <img src="logo.png" alt="HuntIt Logo" class="brand-logo">
      <div class="brand-text">
        <span class="app-name">HuntIt</span>
        <span class="app-tagline">Your favorite hunting guide</span>
      </div>
    </div>

    <!-- Hamburger Button -->
    <button class="menu-btn" (click)="toggleMenu()" aria-label="Toggle Menu" [attr.aria-expanded]="isMenuOpen" aria-controls="accountMenu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <!-- Hamburger Drawer Menu -->
  <div class="drawer-overlay" *ngIf="isMenuOpen" (click)="toggleMenu()"></div>
  <aside id="accountMenu" class="drawer-menu" [class.open]="isMenuOpen" [attr.inert]="isMenuOpen ? null : ''" aria-label="Account menu">
    <div class="drawer-header">
      <h3>Account & Settings</h3>
      <button class="close-btn" (click)="toggleMenu()" aria-label="Close account menu">✕</button>
    </div>
    <ul class="drawer-links">
      <li *ngIf="auth.currentUser()">
        <button type="button" class="drawer-link" routerLink="/profile" (click)="toggleMenu()">👤 Profile</button>
      </li>
      <li *ngIf="auth.currentUser()">
        <button type="button" class="drawer-link" routerLink="/settings" (click)="toggleMenu()">Account &amp; Data Settings</button>
      </li>
      
      <li *ngIf="!auth.currentUser()">
        <button type="button" class="drawer-link" routerLink="/login" (click)="toggleMenu()">Log In</button>
      </li>
      <li *ngIf="!auth.currentUser()">
        <button type="button" class="drawer-link" routerLink="/register" (click)="toggleMenu()">Create Account</button>
      </li>
      <li class="divider"></li>
      
      <!-- Log Out -->
      <li *ngIf="auth.currentUser()">
        <button type="button" class="drawer-link danger" (click)="logout()" [disabled]="logoutPending()">{{ logoutPending() ? 'Logging out…' : '🚪 Log Out' }}</button>
      </li>
    </ul>
    <p *ngIf="logoutError()" role="alert">{{ logoutError() }}</p>
  </aside>

  <!-- Main View Container -->
  <main class="main-content">
    
    <!-- ANGULAR ROUTER OUTLET -->
    <!-- This is where the Home, Results, Log, and Profile screens will render -->
    <router-outlet></router-outlet>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-bar">
    <button class="tab-btn" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </button>
    
    <!-- FIXED: Now routes to your newly created Licenses page -->
    <button class="tab-btn" routerLink="/licenses" routerLinkActive="active">
      <span class="tab-icon">🪪</span>
      <span class="tab-label">Licenses</span>
    </button>
    
    <button class="tab-btn" routerLink="/log" routerLinkActive="active">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Harvest Log</span>
    </button>
  </nav>
</div>
